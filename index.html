<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASRA MASDINGUEM Gédéon — Data Analyst Junior</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
/* ══════════════════════════════════════════════════════════════
   PORTFOLIO — ASRA MASDINGUEM Gédéon
   Dark Luxury · Data-Driven Aesthetic
   ══════════════════════════════════════════════════════════════ */

/* ─── RESET & BASE ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080B14;
  --bg-2: #0D1121;
  --bg-3: #121829;
  --surface: #151C2E;
  --surface-2: #1A2238;
  --border: rgba(99, 128, 255, 0.12);
  --border-2: rgba(99, 128, 255, 0.06);
  --accent: #4F6EF7;
  --accent-2: #6B8AFF;
  --accent-glow: rgba(79, 110, 247, 0.3);
  --gold: #C9A84C;
  --text: #E8EDF8;
  --text-2: #94A3C4;
  --text-3: #5A6A8A;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --radius: 16px;
  --radius-sm: 8px;
  --transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --max-w: 1200px;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent-glow); color: var(--accent-2); }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

/* ─── UTILITIES ─── */
.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 2rem;
}

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-2);
  margin-bottom: 1rem;
}
.section-label::before {
  content: '';
  display: block;
  width: 18px;
  height: 2px;
  background: var(--accent);
}

.section-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 1.25rem;
}
.section-title em {
  font-style: normal;
  background: linear-gradient(135deg, var(--accent-2), #A78BFA);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.section-sub {
  color: var(--text-2);
  font-size: 1.05rem;
  max-width: 520px;
}

.section-header.center { text-align: center; margin-bottom: 4rem; }
.section-header.center .section-label { justify-content: center; }
.section-header.center .section-sub { margin: 0 auto; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.85rem 2rem;
  border-radius: 50px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: var(--transition);
  border: none;
  position: relative;
  overflow: hidden;
}
.btn svg { width: 16px; height: 16px; transition: transform 0.3s ease; }
.btn:hover svg { transform: translate(3px, -3px); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 30px rgba(79, 110, 247, 0.25);
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1));
  opacity: 0;
  transition: opacity 0.3s;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 40px rgba(79, 110, 247, 0.45);
  background: var(--accent-2);
}
.btn-primary:hover::before { opacity: 1; }

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--border);
}
.btn-ghost:hover {
  color: var(--text);
  border-color: var(--accent);
  background: rgba(79, 110, 247, 0.06);
  transform: translateY(-2px);
}

.btn.full-width { width: 100%; justify-content: center; border-radius: var(--radius-sm); }

/* ─── ANIMATIONS ─── */
.reveal-up {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-up.visible { opacity: 1; transform: translateY(0); }

.delay-1 { transition-delay: 0.1s; }
.delay-2 { transition-delay: 0.2s; }
.delay-3 { transition-delay: 0.3s; }
.delay-4 { transition-delay: 0.4s; }
.delay-5 { transition-delay: 0.5s; }

[data-reveal] {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
[data-reveal].visible { opacity: 1; transform: translateY(0); }

/* ══════════════════════════════════════════════════════════════
   NAVBAR
   ══════════════════════════════════════════════════════════════ */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 1.25rem 0;
  transition: all 0.4s ease;
}
.navbar.scrolled {
  background: rgba(8, 11, 20, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-2);
  padding: 0.85rem 0;
}

.nav-container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: 2rem;
}

.nav-logo {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  letter-spacing: -0.02em;
  margin-right: auto;
}
.logo-bracket { color: var(--accent); }
.logo-dot { color: var(--gold); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  list-style: none;
}

.nav-link {
  padding: 0.4rem 0.85rem;
  font-size: 0.875rem;
  color: var(--text-2);
  text-decoration: none;
  border-radius: 50px;
  transition: all 0.25s ease;
  font-weight: 400;
}
.nav-link:hover, .nav-link.active {
  color: var(--text);
  background: rgba(79, 110, 247, 0.08);
}
.nav-link.active { color: var(--accent-2); }

.nav-cta {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--accent-2);
  text-decoration: none;
  padding: 0.5rem 1.25rem;
  border: 1px solid rgba(79, 110, 247, 0.35);
  border-radius: 50px;
  transition: var(--transition);
  white-space: nowrap;
}
.nav-cta:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: var(--transition);
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* ══════════════════════════════════════════════════════════════
   HERO
   ══════════════════════════════════════════════════════════════ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  padding: 8rem 2rem 4rem;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(79, 110, 247, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79, 110, 247, 0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 40%, transparent 100%);
}

.hero-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.orb-1 {
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(79, 110, 247, 0.18) 0%, transparent 70%);
  top: -100px;
  right: -100px;
  animation: orbFloat 8s ease-in-out infinite;
}
.orb-2 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(167, 139, 250, 0.12) 0%, transparent 70%);
  bottom: 0;
  left: -80px;
  animation: orbFloat 10s ease-in-out infinite reverse;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -30px); }
}

.hero-particles {
  position: absolute;
  inset: 0;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--accent-2);
  border-radius: 50%;
  animation: particleDrift linear infinite;
  opacity: 0;
}
@keyframes particleDrift {
  0% { opacity: 0; transform: translateY(0); }
  10% { opacity: 0.6; }
  90% { opacity: 0.3; }
  100% { opacity: 0; transform: translateY(-80px); }
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: var(--max-w);
  margin: 0 auto;
  width: 100%;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 1.1rem;
  background: rgba(79, 110, 247, 0.08);
  border: 1px solid rgba(79, 110, 247, 0.2);
  border-radius: 50px;
  font-size: 0.78rem;
  color: var(--accent-2);
  font-weight: 500;
  margin-bottom: 2rem;
}

.badge-dot {
  width: 6px;
  height: 6px;
  background: #4ADE80;
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px #4ADE80; }
  50% { opacity: 0.4; box-shadow: none; }
}

.hero-name {
  font-family: var(--font-display);
  font-size: clamp(3rem, 7vw, 5.5rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 1.25rem;
}
.hero-firstname {
  color: var(--accent-2);
}

.hero-title {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--font-display);
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 1.75rem;
  min-height: 2rem;
}
.title-prefix {
  color: var(--accent);
  font-size: 1.5rem;
  line-height: 1;
}
.typing-text { color: var(--text); }
.typing-cursor {
  color: var(--accent);
  animation: blink 0.7s step-end infinite;
  font-weight: 300;
}

.hero-tagline {
  font-size: clamp(1rem, 1.6vw, 1.15rem);
  color: var(--text-2);
  max-width: 520px;
  margin-bottom: 2.5rem;
  line-height: 1.75;
}
.hero-tagline em { font-style: normal; color: var(--text); font-weight: 500; }

.hero-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 4rem;
}

.hero-stats {
  display: flex;
  align-items: center;
  gap: 2.5rem;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.stat-label {
  font-size: 0.75rem;
  color: var(--text-3);
  font-weight: 400;
  letter-spacing: 0.05em;
}
.stat-divider {
  width: 1px;
  height: 40px;
  background: var(--border);
}

.hero-scroll-hint {
  position: absolute;
  bottom: 2.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-3);
  z-index: 1;
}
.scroll-line {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, var(--accent), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%, 100% { transform: scaleY(1); opacity: 1; }
  50% { transform: scaleY(0.6); opacity: 0.5; }
}

/* ══════════════════════════════════════════════════════════════
   ABOUT
   ══════════════════════════════════════════════════════════════ */
.about {
  padding: 7rem 0;
  position: relative;
}
.about::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 5rem;
  align-items: center;
}

/* About Visual */
.about-visual { position: relative; }

.about-card-wrap {
  perspective: 1000px;
  margin-bottom: 1.5rem;
}
.about-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  transition: transform 0.4s ease;
  position: relative;
  overflow: hidden;
}
.about-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(79, 110, 247, 0.04), transparent 60%);
}
.about-card:hover { transform: translateY(-4px); }

.card-avatar {
  position: relative;
  width: 80px;
  height: 80px;
}
.avatar-initials {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 800;
  color: #fff;
}
.avatar-ring {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  opacity: 0.4;
  animation: ringPulse 3s ease-in-out infinite;
}
@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.08); opacity: 0.2; }
}

.card-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}
.chip {
  font-size: 0.75rem;
  padding: 0.3rem 0.75rem;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: 50px;
  color: var(--text-2);
}

.card-status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: #4ADE80;
  font-weight: 500;
}
.status-pulse {
  width: 8px;
  height: 8px;
  background: #4ADE80;
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
  flex-shrink: 0;
}

/* Data visual bars */
.about-data-visual {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
}
.data-bar-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 80px;
  margin-bottom: 0.75rem;
}
.data-bar {
  flex: 1;
  height: var(--h);
  background: linear-gradient(to top, var(--accent), rgba(107, 138, 255, 0.3));
  border-radius: 4px 4px 0 0;
  position: relative;
  transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  transform-origin: bottom;
}
.data-bar span {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  color: var(--text-3);
  white-space: nowrap;
}
.data-caption {
  font-size: 0.72rem;
  color: var(--text-3);
  margin-top: 1.5rem;
  text-align: center;
  letter-spacing: 0.04em;
}

/* About Text */
.about-desc {
  color: var(--text-2);
  margin-bottom: 1.25rem;
  font-size: 1rem;
  line-height: 1.8;
}

.about-values {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 2rem;
}
.value-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  transition: border-color 0.3s, background 0.3s;
}
.value-item:hover {
  border-color: var(--border);
  background: var(--surface-2);
}
.value-icon { font-size: 1.25rem; flex-shrink: 0; }
.value-item strong { display: block; font-size: 0.9rem; color: var(--text); margin-bottom: 0.2rem; }
.value-item span { font-size: 0.8rem; color: var(--text-3); }

/* ══════════════════════════════════════════════════════════════
   SKILLS
   ══════════════════════════════════════════════════════════════ */
.skills {
  padding: 7rem 0;
  background: var(--bg-2);
  position: relative;
}
.skills::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}

.skill-card {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 1.75rem;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  cursor: default;
}
.skill-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}
.skill-card:hover {
  border-color: var(--border);
  transform: translateY(-6px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
}
.skill-card:hover::after { transform: scaleX(1); }

.skill-icon-wrap { margin-bottom: 1.25rem; }
.skill-icon { width: 48px; height: 48px; }

.skill-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.75rem;
}
.skill-desc {
  font-size: 0.82rem;
  color: var(--text-3);
  line-height: 1.7;
  margin-bottom: 1.25rem;
}

.skill-level {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}
.skill-bar {
  flex: 1;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.skill-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.skill-fill.animated { width: var(--w); }
.skill-level span { font-size: 0.78rem; color: var(--accent-2); font-weight: 600; white-space: nowrap; }

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.skill-tags span {
  font-size: 0.67rem;
  padding: 0.2rem 0.55rem;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: 4px;
  color: var(--text-3);
  letter-spacing: 0.03em;
}

/* ══════════════════════════════════════════════════════════════
   PROJECTS
   ══════════════════════════════════════════════════════════════ */
.projects {
  padding: 7rem 0;
  position: relative;
}

.projects-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 1.5rem;
  align-items: start;
}

.project-card {
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 2rem;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.project-card:hover {
  border-color: rgba(79, 110, 247, 0.25);
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.project-accent {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
